# .github/workflows/load-test.yml
#
# Runs a test saved on your Spitfire controller as a performance gate on every
# pull request: the step fails when a threshold fails (exit code 99) and the
# pull request gets a summary comment. Create a personal token in Spitfire
# (user menu → API tokens → Create token) and store it as SPITFIRE_TOKEN.
# The action: https://github.com/taner-akdemir/spitfire-action
on: [pull_request]
permissions:
  contents: read
  pull-requests: write   # the summary comment
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: taner-akdemir/spitfire-action@v1
        with:
          url: https://spitfire.example.com   # your controller
          token: ${{ secrets.SPITFIRE_TOKEN }}
          test: "Shop: log in, browse, add to cart, check out"
          environment: staging
          confirm-writes: true                 # the test adds to the cart
      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spitfire-summary
          path: spitfire-summary.json
